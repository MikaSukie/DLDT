<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  font-family: system-ui, sans-serif;
  background: white;
}
input, button {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  font: inherit;
}
video {
  display: block;
  width: 100%;
  max-height: 75vh;
  margin: 8px 0 12px;
  background: #000;
}
</style>
</head>
<body>

<input id="url" type="url" placeholder="Link:" autocomplete="url">

<button onclick="loadVideo()">Open video</button>

<video id="video" controls playsinline hidden></video>

<button onclick="downloadVideo()">Download video</button>

<script>
const input = document.getElementById('url');
const video = document.getElementById('video');

function loadVideo() {
  const url = input.value.trim();
  if (!/^https?:\/\//i.test(url)) return;

  video.src = url;
  video.hidden = false;
  video.load();
}

function downloadVideo() {
  const url = input.value.trim();
  if (!/^https?:\/\//i.test(url)) return;

  const a = document.createElement('a');
  a.href = url;
  a.download = '';
  a.target = '_blank';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
}
</script>

</body>
</html>
