```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        min-height: 100%;
        background: #fff;
        font-family: system-ui, sans-serif;
    }

    .container {
        padding: 20px;
        max-width: 700px;
        margin: 0 auto;
    }

    label {
        display: block;
        margin-bottom: 8px;
    }

    input {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 12px;
    }

    button {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        cursor: pointer;
        border: 1px solid #aaa;
        border-radius: 6px;
        background: #f5f5f5;
    }

    button:active {
        background: #ddd;
    }
</style>
</head>

<body>

<div class="container">
    <label for="videoUrl">Link:</label>

    <input
        id="videoUrl"
        type="url"
        placeholder="https://example.com/video.mp4"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
    >

    <button onclick="downloadVideo()">
        Trigger download
    </button>
</div>

<script>
function downloadVideo() {
    const url = document.getElementById("videoUrl").value.trim();

    if (!url) return;

    const link = document.createElement("a");

    link.href = url;
    link.download = "";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>

</body>
</html>
```
